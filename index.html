<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>少女祈祷中…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #fafafa;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
    }
    /* 与站内加载页完全一致的「少女祈祷中」样式 */
    .praying-text {
      font-size: clamp(40px, 10vw, 86px);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1.1;
      background: linear-gradient(135deg, #e91e63 0%, #9c27b0 50%, #673ab7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 18px rgba(233, 30, 99, 0.22);
      filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.6));
    }
    .praying-text::after { content: ""; animation: praying-dots 1.5s infinite; }
    @keyframes praying-dots {
      0%, 100% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .praying-img {
      max-width: min(100%, 520px);
      max-height: 60vh;
      width: auto; height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      background: #fff;
    }
    /* 兜底入口：加载偏慢时才淡入，避免正常情况干扰画面 */
    .manual { font-size: 14px; color: #8a8a8a; opacity: 0; transition: opacity .4s; }
    .manual.show { opacity: 1; }
    .manual a { color: #ec8fa5; }
    #preload { display: none; }
  </style>
</head>
<body>
  <div class="praying-text">少女祈祷中</div>
  <video class="praying-img" src="./my-app/assets/praying.mp4"
         autoplay loop muted playsinline preload="auto" aria-label="少女祈祷中"></video>
  <p class="manual" id="manual">加载较慢？<a href="./my-app/">直接进入 →</a></p>

  <noscript>
    <p class="manual show">你的浏览器未启用脚本，<a href="./my-app/">点击进入 →</a></p>
  </noscript>

  <!-- 后台优先预加载即将跳转的界面（./my-app/ 首页），同时前台一直播放少女祈祷中动画；
       待该界面图片（含 CSS 背景图、卡片图、视频首帧）全部就绪后再真正进入 -->
  <iframe id="preload" src="./my-app/" tabindex="-1" aria-hidden="true"></iframe>

  <script>
    (function () {
      var target = './my-app/';
      var done = false;
      var manual = document.getElementById('manual');
      var f = document.getElementById('preload');
      var bgCache = {};   // 已探测过的 CSS 背景图 URL -> true/进行中

      function go() {
        if (done) return;
        done = true;
        // 进入前再确保祈祷动画已播一会儿，避免闪烁
        window.location.replace(target);
      }

      // 判断目标文档「渲染完成 + 图片全部就绪」
      function imagesReady(doc) {
        if (!doc) return false;

        // 1) 所有 <img> 必须加载完成且有效
        var imgs = doc.querySelectorAll('img');
        for (var i = 0; i < imgs.length; i++) {
          var im = imgs[i];
          if (!im.complete || im.naturalWidth === 0) return false;
        }

        // 2) 所有 <video> 至少拿到首帧/元数据（封面已可显示）
        var vids = doc.querySelectorAll('video');
        for (var j = 0; j < vids.length; j++) {
          if (vids[j].readyState < 1) return false;
        }

        // 3) CSS 背景图（body / #app / 常见容器）：解析 url 并在 iframe 文档内预加载
        var sel = 'body, #app, .cat-card, .home-hero, .module-card, .work-item, .og-card, .video-card, .char-detail, .detail-main';
        var elems = doc.querySelectorAll(sel);
        for (var k = 0; k < elems.length; k++) {
          var bg = null;
          try { bg = doc.defaultView.getComputedStyle(elems[k]).backgroundImage; } catch (e) { continue; }
          if (!bg || bg === 'none' || bg.indexOf('url(') < 0) continue;
          if (bgCache[bg] === true) continue;
          var m = bg.match(/url\(["']?([^)"']+)["']?\)/);
          if (!m) continue;
          if (!(bg in bgCache)) {
            bgCache[bg] = 'loading';
            var url = m[1];
            var probe = doc.createElement('img');
            (function (key) {
              probe.onload = probe.onerror = function () { bgCache[key] = true; };
            })(bg);
            probe.src = url;   // 相对路径按 iframe 文档基准解析
          }
          if (bgCache[bg] !== true) return false;
        }
        return true;
      }

      function waitRendered() {
        var doc = null;
        try { doc = f.contentDocument; } catch (e) { go(); return; }
        if (!doc) { go(); return; }
        var t0 = Date.now();
        var timer = setInterval(function () {
          var app = doc.getElementById('app');
          var stillLoading = doc.querySelector('.loading-state');
          var rendered = !!app && app.children.length > 0 && !stillLoading;
          if (rendered && imagesReady(doc)) {
            clearInterval(timer);
            setTimeout(go, 200);          // 稍作缓冲，让首帧稳定
          } else if (Date.now() - t0 > 12000) {
            clearInterval(timer);
            go();                          // 兜底：绝不卡死在加载页
          }
        }, 150);
      }

      if (f) {
        f.addEventListener('load', waitRendered);
        f.addEventListener('error', go);
      }
      // 兜底：3.5s 显示手动入口，15s 后无论如何进入
      setTimeout(function () { if (manual) manual.classList.add('show'); }, 3500);
      setTimeout(go, 15000);
    })();
  </script>
</body>
</html>

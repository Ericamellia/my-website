<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东方Project同人作品查询｜Day 7 MVP</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script>
    // 页面出错时直接把原因显示出来，便于定位（正常情况下不显示任何东西）
    function showLoadError(msg) {
      var app = document.getElementById('app');
      if (!app || !/加载中/.test(app.textContent)) return;
      app.innerHTML = '<p class="empty-state">页面加载出错：' + msg +
        '<br>请先按 Ctrl+F5 强制刷新；若仍不行，把这段文字发给我。</p>';
    }
    window.addEventListener('error', function (e) { showLoadError(e.message || '未知脚本错误'); });
    window.addEventListener('unhandledrejection', function (e) {
      showLoadError((e.reason && (e.reason.message || e.reason)) || '未知请求错误');
    });
  </script>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="#/">东方Project同人作品查询</a></h1>
      <nav>
        <a href="#/music">同人音乐</a>
        <a href="#/doujin">同人漫画</a>
        <a href="#/game">同人游戏</a>
        <a href="#/video">同人视频</a>
        <a href="#/original">ZUN原曲</a>
      </nav>
    </div>
  </header>
  <main id="app" class="container">
    <p style="text-align:center;color:#999;margin-top:48px;">加载中…</p>
  </main>
  <footer style="text-align:center;color:#999;font-size:12px;padding:24px 16px;border-top:1px solid #e8e8e8;margin-top:32px;">
    Day 7 MVP · 数据为模拟（mock）· 部署: GitHub Pages
  </footer>
  <script src="app.js?v=6" defer></script>
</body>
</html>

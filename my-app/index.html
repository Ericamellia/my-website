<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东方Project同人作品查询｜Day 7 MVP</title>
  <link rel="stylesheet" href="style.css?v=94">
  <script>
    // 页面出错时直接把原因显示出来，便于定位（正常情况下不显示任何东西）
    function showLoadError(msg) {
      var app = document.getElementById('app');
      if (!app || !app.querySelector('.loading-state')) return;
      app.innerHTML = '<p class="empty-state">页面加载出错：' + msg +
        '<br>请先按 Ctrl+F5 强制刷新；若仍不行，把这段文字发给我。</p>';
    }
    window.addEventListener('error', function (e) { showLoadError(e.message || '未知脚本错误'); });
    window.addEventListener('unhandledrejection', function (e) {
      showLoadError((e.reason && (e.reason.message || e.reason)) || '未知请求错误');
    });
  </script>
</head>
<body>

    <div class="container">

          </svg>
          <span class="nav-label">返回上一页</span>
        </button>
        <a class="home-link" href="#/" aria-label="返回首页" title="返回首页">

            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>

  <main id="app" class="container">
    <div class="loading-state">
      <div class="praying-text">少女祈祷中</div>
      <video class="praying-img" src="assets/praying.mp4" autoplay loop muted playsinline preload="auto" aria-label="少女祈祷中"></video>

  <footer class="site-footer">
    Day 7 MVP · 数据为模拟（mock）· 部署: GitHub Pages

  <!-- 大图预览遮罩：点击详情页配图时全屏显示（app.js 控制开关） -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" src="" alt="" referrerpolicy="no-referrer">
  </div>
  <!-- 修改作品信息弹窗：详情页「修改介绍」按钮唤起（app.js 填充表单内容） -->
  <div id="editModal" class="edit-modal" hidden>
    <div class="edit-panel">
      <div class="edit-head">
        <h3>修改作品信息</h3>
        <button id="editClose" class="edit-close" type="button" aria-label="关闭">×</button>
      </div>
      <form id="editForm" class="edit-form"></form>
    </div>
  </div>
  <!-- 操作反馈提示：收藏/保存/上传等动作完成时从底部浮出（app.js 控制内容与显隐） -->
  <div id="toast" class="toast" hidden></div>
  <!-- 返回顶端浮动按钮：固定在右下角，位于「加入作品」按钮上方（app.js 绑定点击） -->
  <button id="backTop" class="fab fab-backtop" type="button" aria-label="返回顶端" title="返回顶端">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
    <span class="fab-tip">返回顶端</span>
  </button>
  <!-- 教训baka 浮动按钮：固定在返回顶端按钮正上方（app.js 绑定点击） -->

    <span class="baka-face" aria-hidden="true">ᗜ‿ᗜ</span>
    <span class="fab-tip">教训baka</span>
  </button>
  <script src="app.js?v=76" defer></script>
